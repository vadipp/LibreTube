# Prepared location to add ONLY inside the existing internal Piped API server.
# Keep existing CORS headers and the outer Authelia gate. All other locations stay.
# Resolve container only after it is healthy and attached to the existing network.
location ~ "^/downloads/streams/[A-Za-z0-9_-]{11}$" {
    proxy_pass http://extractor-adapter:8080;
    proxy_read_timeout 120s;
    proxy_connect_timeout 2s;
    proxy_cache off;
    proxy_intercept_errors on;
    error_page 502 503 504 = @original_piped_stream;
}

# If the adapter is unavailable, keep the original backend route working.
# Uses the existing "backend" upstream; confirm its name before deployment.
location @original_piped_stream {
    rewrite "^/downloads/streams/([A-Za-z0-9_-]{11})$" /streams/$1 break;
    proxy_pass http://backend;
}
