# Disposable routing fixture; no production network or host ports required.
error_log stderr;
pid /tmp/nginx.pid;
events {}
http {
    access_log off;
    upstream backend { server 127.0.0.1:18083; }
    # Mock unavailable adapter; alias extractor-adapter resolves to loopback.
    server {
        listen 8080;
        location = /downloads/streams/LMNOPQRSTUV { return 200 "adapter"; }
        location / { return 503; }
    }
    server { listen 18083; return 200 "$uri"; }
    server {
        listen 18081;
        include /probe/deploy/nginx.example.conf;
        location / { proxy_pass http://backend; }
    }
}
