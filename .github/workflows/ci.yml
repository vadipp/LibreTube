name: CI

concurrency:
  group: ci-${{ github.event.pull_request.head.ref || github.ref_name }}-${{ github.event_name == 'pull_request' && 'pr' || 'branch' }}
  cancel-in-progress: true

on:
  workflow_dispatch:
  pull_request:
    paths-ignore:
      - "README*.md"
      - "fastlane/**"
      - "assets/**"
      - ".github/**/*.md"
  push:
    paths-ignore:
      - "README*.md"
      - "fastlane/**"
      - "assets/**"
      - ".github/**/*.md"

permissions:
  contents: read

jobs:
  extractor-adapter-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version: '1.27'
          cache: false
      - name: Test download-only adapter
        working-directory: tools/piped-extractor-adapter
        run: go test -race ./...
      - name: Build pinned adapter image
        run: docker build --platform linux/amd64 -t piped-extractor-adapter:ci tools/piped-extractor-adapter
      - name: Verify exact container runtime without deployment
        shell: bash
        run: |
          flags=(--memory=384m --memory-swap=384m --cpus=0.5 --pids-limit=64 --read-only --tmpfs /tmp:rw,noexec,nosuid,size=16m,mode=1777 --cap-drop=ALL --security-opt=no-new-privileges)
          docker run --rm "${flags[@]}" --entrypoint /opt/yt-dlp piped-extractor-adapter:ci --version
          docker run -d --name adapter-ci --network=none "${flags[@]}" piped-extractor-adapter:ci
          trap 'docker rm -f adapter-ci >/dev/null 2>&1 || true' EXIT
          for attempt in 1 2 3 4 5; do
            if docker exec adapter-ci /usr/local/bin/piped-extractor-adapter healthcheck; then break; fi
            sleep 1
          done
          docker exec adapter-ci /usr/local/bin/piped-extractor-adapter healthcheck

  debug-builds:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.package.outputs.version }}
    steps:
      - uses: actions/checkout@v6
      - uses: gradle/actions/wrapper-validation@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.x' # Version range or exact version of a Python version to use, using SemVer's version range syntax
          architecture: 'x64' # optional x64 or x86. Defaults to x64 if not specified

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: 17
          distribution: "temurin"
          cache: "gradle"

      - name: Test instance authentication independently of Android and KSP
        shell: bash
        run: |
          ./gradlew -p tools/auth-session-tests test --no-parallel --max-workers=1 --no-configuration-cache --stacktrace 2>&1 | tee auth-tests.log

      - name: Compile
        shell: bash
        run: |
          ./gradlew testDebugUnitTest lintDebug assembleDebug -PciBuildNumber="$GITHUB_RUN_NUMBER" --no-parallel --max-workers=1 --no-configuration-cache -Pksp.incremental=false --stacktrace 2>&1 | tee build.log

      - name: Compile optimized release
        if: github.ref_name == 'master'
        shell: bash
        run: |
          ./gradlew assembleRelease -PciBuildNumber="$GITHUB_RUN_NUMBER" --no-parallel --max-workers=1 --no-configuration-cache -Pksp.incremental=false --stacktrace 2>&1 | tee release-build.log

      - name: Publish compiler diagnostics
        if: always()
        run: |
          node <<'JS'
          const fs = require('fs');
          const lines = ['auth-tests.log', 'build.log', 'release-build.log'].filter(p => fs.existsSync(p)).flatMap(p => fs.readFileSync(p, 'utf8').split('\n'));
          const escape = s => s.replaceAll('%', '%25').replaceAll('\r', '%0D').replaceAll('\n', '%0A');
          const errors = lines.filter(s => /(^e: |^error: |^Caused by: |^Execution failed|FAILED| > .*FAILED|^\s+at (com\.google\.devtools|ksp\.|org\.jetbrains))/.test(s));
          for (const line of errors.slice(0, 40)) console.log('::error::' + escape(line));
          if (lines.some(s => /BUILD FAILED|FAILURE: Build failed/.test(s))) {
            console.log('::error::' + escape(lines.slice(-90).join('\n')));
          }
          JS

      - name: Report authentication test results
        if: always()
        run: |
          node <<'JS'
          const fs = require('fs');
          const path = require('path');
          const escape = s => s.replaceAll('%', '%25').replaceAll('\r', '%0D').replaceAll('\n', '%0A');
          for (const dir of ['tools/auth-session-tests/build/test-results/test', 'app/build/test-results/testDebugUnitTest']) {
            if (!fs.existsSync(dir)) continue;
            for (const name of fs.readdirSync(dir).filter(n => n.endsWith('.xml'))) {
              const xml = fs.readFileSync(path.join(dir, name), 'utf8');
              console.log('::notice::' + escape(xml.match(/<testsuite[^>]*>/)?.[0] || name));
              for (const failure of xml.matchAll(/<failure[\s\S]*?<\/failure>/g)) {
                const details = failure[0].split('\n');
                const causes = details.filter(s => /Caused by:|Not mocked|not mocked|AutheliaSession\.kt:/.test(s));
                console.log('::error::' + escape([details[0], ...causes, ...details.slice(1, 10)].join('\n').slice(0, 3800)));
              }
            }
          }
          JS

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: test-reports
          path: |
            app/build/reports/tests/
            app/build/reports/lint-results-debug.*
            app/build/test-results/
            tools/auth-session-tests/build/reports/tests/
            tools/auth-session-tests/build/test-results/
            auth-tests.log
            build.log
            release-build.log
          if-no-files-found: ignore

      - name: Upload database schema
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: database-schemas
          path: app/schemas/

      - name: Sign with persistent repository key
        if: github.event_name != 'pull_request'
        shell: bash
        env:
          ANDROID_SIGNING_KEY: ${{ secrets.ANDROID_SIGNING_KEY }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: bash .github/scripts/sign-apk.sh

      - name: Package versioned APK
        id: package
        run: node .github/scripts/package-apk.mjs

      - name: Upload APK
        uses: actions/upload-artifact@v6
        with:
          name: app
          path: dist/
          if-no-files-found: error

  api25-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: debug-builds
    steps:
      - uses: actions/checkout@v6
      - uses: actions/download-artifact@v5
        with:
          name: app
          path: dist
      - name: Enable emulator acceleration
        run: sudo chmod 666 /dev/kvm
      - name: Install and open on Android 7.1
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 25
          target: default
          arch: x86
          profile: Nexus 6
          ram-size: 1536M
          disable-animations: true
          emulator-boot-timeout: 600
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          script: bash .github/scripts/api25-smoke.sh
      - name: Upload API 25 runtime diagnostics
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: api25-smoke
          path: api25-smoke/
          if-no-files-found: ignore

  publish-apk:
    # PRs compile/test but cannot publish or use the persistent signing key.
    if: github.event_name != 'pull_request'
    permissions:
      contents: write
    runs-on: ubuntu-latest
    needs: [debug-builds, api25-smoke, extractor-adapter-tests]
    steps:
      - uses: actions/download-artifact@v5
        with:
          name: app
          path: dist

      - name: Publish directly downloadable APK
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ needs.debug-builds.outputs.version }}
        shell: bash
        run: |
          tag="build-${GITHUB_RUN_NUMBER}-${GITHUB_RUN_ATTEMPT}"
          cat > release-notes.txt <<EOF
          LibreTube $VERSION from branch $GITHUB_REF_NAME.

          Download the .apk asset directly; no ZIP extraction is needed.
          Master builds include debug (com.github.libretube.debug) and optimized release (com.github.libretube).
          The .sha256 asset records its checksum.

          Source: $GITHUB_SHA
          CI: https://github.com/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID
          EOF
          gh release create "$tag" dist/*.apk dist/*.sha256 \
            --target "$GITHUB_SHA" --title "LibreTube $VERSION ($GITHUB_REF_NAME)" \
            --notes-file release-notes.txt --prerelease --latest=false
          echo "Download: https://github.com/$GITHUB_REPOSITORY/releases/tag/$tag" >> "$GITHUB_STEP_SUMMARY"
