name: CI
on:
  workflow_dispatch:
  push:
    branches: [test/server-extractors]
    paths:
      - tools/extractor-probe/**
      - .github/workflows/ci.yml
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - name: Test yt-dlp
        shell: bash
        run: |
          python -m pip install 'yt-dlp[default]==2026.10.26'
          timeout 300 python tools/extractor-probe/probe.py QvW61K2s0tA 99rI-nOCajM dQw4w9WgXcQ | tee yt-dlp-summary.jsonl
      - name: Build current NewPipeExtractor probe
        shell: bash
        run: |
          git clone --depth 1 --branch v0.27.0 https://github.com/TeamNewPipe/NewPipeExtractor.git /tmp/newpipe
          mkdir -p /tmp/newpipe/extractor/src/main/java/probe
          cp tools/extractor-probe/ExtractorProbe.java /tmp/newpipe/extractor/src/main/java/probe/
          cd /tmp/newpipe
          ./gradlew :extractor:probeJar -I "$GITHUB_WORKSPACE/tools/extractor-probe/fatjar.gradle" --no-daemon --max-workers=1 -Dorg.gradle.jvmargs=-Xmx1g
      - name: Test NewPipeExtractor
        shell: bash
        run: |
          timeout 300 java -Xmx256m -jar /tmp/newpipe/extractor/build/libs/extractor-probe.jar QvW61K2s0tA 99rI-nOCajM dQw4w9WgXcQ > newpipe-output.txt 2>&1
          grep '^{' newpipe-output.txt | tee newpipe-summary.jsonl
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: extractor-experiment
          path: |
            *-summary.jsonl
            /tmp/newpipe/extractor/build/libs/extractor-probe.jar
          retention-days: 7
