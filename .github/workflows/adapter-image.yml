name: Build extractor adapter image
on:
  workflow_dispatch:
  push:
    branches: [feature/download-only-extractor]
    paths:
      - tools/piped-extractor-adapter/**
      - .github/workflows/adapter-image.yml
permissions:
  contents: read
jobs:
  image:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version: '1.27'
          cache: false
      - name: Format Go source
        run: |
          gofmt -w tools/piped-extractor-adapter/*.go
          git diff --binary -- tools/piped-extractor-adapter/*.go > gofmt.patch
      - uses: actions/upload-artifact@v6
        with:
          name: adapter-gofmt
          path: gofmt.patch
      - name: Run adapter regression tests
        working-directory: tools/piped-extractor-adapter
        run: go test -race ./...
      - name: Build and verify deployable image
        shell: bash
        run: |
          image="piped-extractor-adapter:$GITHUB_SHA"
          docker build --platform linux/amd64 --label "org.opencontainers.image.revision=$GITHUB_SHA" -t "$image" tools/piped-extractor-adapter
          flags=(--memory=384m --memory-swap=384m --cpus=0.5 --pids-limit=64 --read-only --tmpfs /tmp:rw,noexec,nosuid,size=16m,mode=1777 --cap-drop=ALL --security-opt=no-new-privileges)
          test "$(docker run --rm "${flags[@]}" --entrypoint /opt/yt-dlp "$image" --version)" = 2026.10.26
          docker run -d --name adapter-image-smoke --network=none "${flags[@]}" "$image"
          trap 'docker rm -f adapter-image-smoke >/dev/null 2>&1 || true' EXIT
          sleep 2
          docker exec adapter-image-smoke /usr/local/bin/piped-extractor-adapter healthcheck
          mkdir bundle
          docker save "$image" | gzip > bundle/adapter-image.tar.gz
          (cd bundle && sha256sum adapter-image.tar.gz > adapter-image.tar.gz.sha256)
          docker image inspect "$image" --format '{{.Id}}' > bundle/image-id.txt
          printf '%s\n' "$GITHUB_SHA" > bundle/revision.txt
      - uses: actions/upload-artifact@v6
        with:
          name: piped-extractor-adapter-image
          path: bundle/
          retention-days: 7
